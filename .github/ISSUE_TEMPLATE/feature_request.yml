name: Feature request
description: Suggest a new capability or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Share the problem first, then your proposal.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What pain point are you solving?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe desired behavior and UX.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds or other approaches.

  - type: dropdown
    id: impact
    attributes:
      label: Expected impact
      options:
        - Nice-to-have
        - Useful for common workflows
        - High impact / currently blocked
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Example usage
      description: Optional command examples.
      placeholder: |
        vibe setup --preset research

name: Bug report
description: Report a reproducible problem in vibe CLI.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please provide enough details so we can reproduce quickly.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Short description of the bug.
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command used
      description: Exact command and flags.
      placeholder: vibe setup --research --local
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Numbered minimal steps.
      placeholder: |
        1. Run ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste terminal output or stack trace.
      render: shell

  - type: input
    id: vibe_version
    attributes:
      label: vibe version
      placeholder: 0.2.1
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: v20.11.1
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 14 / Ubuntu 22.04 / Windows 11
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Environment details or extra notes.

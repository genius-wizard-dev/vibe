name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: Force release even when src/package.json did not change
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, Publish, Tag, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect release scope
        id: scope
        run: |
          FORCE_RELEASE="${{ github.event.inputs.force_release || 'false' }}"
          if [ "$FORCE_RELEASE" = "true" ]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::force_release enabled. Full release pipeline will run."
            exit 0
          fi

          BASE_SHA=""
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="$(git rev-list --max-count=1 HEAD^ 2>/dev/null || true)"
          fi

          if [ -n "$BASE_SHA" ]; then
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA"...HEAD)"
          else
            CHANGED_FILES="$(git show --name-only --pretty='' HEAD)"
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -E '^(src/|package.json$)' >/dev/null; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Source or package changes detected. Release pipeline will run."
          else
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No src/package.json changes. Skip npm publish and GitHub release."
          fi

      - name: Setup Node.js
        if: steps.scope.outputs.release_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate project
        if: steps.scope.outputs.release_needed == 'true'
        run: |
          npm install
          npm run ci

      - name: Read package metadata
        id: pkg
        if: steps.scope.outputs.release_needed == 'true'
        run: |
          NAME="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));process.stdout.write(p.name)")"
          VERSION="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));process.stdout.write(p.version)")"
          TAG="v${VERSION}"

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          echo "::notice::Package: ${NAME}"
          echo "::notice::Version: ${VERSION}"
          echo "::notice::Tag: ${TAG}"

      - name: Check npm version existence
        id: npm_check
        if: steps.scope.outputs.release_needed == 'true'
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::npm version already exists. Skip publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::npm version does not exist yet."
          fi

      - name: Ensure NPM_TOKEN exists
        if: steps.scope.outputs.release_needed == 'true' && steps.npm_check.outputs.exists != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Missing NPM_TOKEN secret. Add it in GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Publish to npm
        if: steps.scope.outputs.release_needed == 'true' && steps.npm_check.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Check git tag existence
        id: tag_check
        if: steps.scope.outputs.release_needed == 'true'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.pkg.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag does not exist yet."
          fi

      - name: Create git tag
        if: steps.scope.outputs.release_needed == 'true' && steps.tag_check.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.pkg.outputs.tag }}"
          git push origin "${{ steps.pkg.outputs.tag }}"

      - name: Generate release notes
        id: notes
        if: steps.scope.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG="$(git tag --sort=-creatordate | grep -E '^v[0-9]' | head -n 1 || true)"
          if [ "$PREV_TAG" = "${{ steps.pkg.outputs.tag }}" ]; then
            PREV_TAG="$(git tag --sort=-creatordate | grep -E '^v[0-9]' | sed -n '2p' || true)"
          fi
          node scripts/generate-release-notes.mjs \
            --version "${{ steps.pkg.outputs.version }}" \
            --tag "${{ steps.pkg.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --prev-tag "$PREV_TAG" \
            --output RELEASE_NOTES.md

      - name: Check release existence
        id: release_check
        if: steps.scope.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.pkg.outputs.tag }}" --repo "genius-wizard-dev/vibe" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub release already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub release does not exist yet."
          fi

      - name: Create GitHub release
        if: steps.scope.outputs.release_needed == 'true' && steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.pkg.outputs.tag }}" \
            --repo "genius-wizard-dev/vibe" \
            --title "${{ steps.pkg.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md

      - name: Upload changelog asset
        if: steps.scope.outputs.release_needed == 'true' && steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.pkg.outputs.tag }}" RELEASE_NOTES.md \
            --repo "genius-wizard-dev/vibe" \
            --clobber

      - name: Skip release for non-source changes
        if: steps.scope.outputs.release_needed != 'true'
        run: |
          echo "Release pipeline skipped because no src/package.json changes were detected."

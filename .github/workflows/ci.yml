name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run CI checks
        run: npm run ci

  required-checks:
    name: Required checks
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    steps:
      - name: Ensure matrix jobs passed
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "Matrix validation failed"
            exit 1
          fi
          echo "All required CI checks passed"
